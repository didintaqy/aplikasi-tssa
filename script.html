/* --- formulir pemasukan / pengeluaran --- */

function opsiKategoriKas(jenis, terpilih) {
  var daftar = (jenis === 'Masuk' ? APP.ku.konfig.kat_masuk : APP.ku.konfig.kat_keluar).slice();
  if (terpilih && daftar.indexOf(terpilih) < 0) daftar.push(terpilih);
  return daftar.map(function (k) {
    return '<option' + (k === terpilih ? ' selected' : '') + '>' + aman(k) + '</option>';
  }).join('');
}

function bukaFormKas(jenis, r) {
  if (!APP.ku.konfig) return pesan('Data kategori belum termuat. Coba lagi.', true);
  el('kfId').value = r ? r.id : '';
  el('kfJenis').value = jenis;
  el('kfJudul').textContent = (r ? 'Edit ' : 'Catat ') + (jenis === 'Masuk' ? 'pemasukan' : 'pengeluaran');
  el('kfTanggal').value = r ? r.tanggal : hariIni();
  el('kfKategori').innerHTML = opsiKategoriKas(jenis, r ? r.kategori : '');
  el('kfJumlah').value = r ? r.jumlah : '';
  el('kfMetode').innerHTML = APP.ku.konfig.metode.map(function (m) {
    return '<option' + (r && r.metode === m ? ' selected' : '') + '>' + aman(m) + '</option>';
  }).join('');
  el('kfKet').value = r ? r.uraian : '';
  el('kfNota').value = ''; APP.ku.nota = null;
  el('kfNotaInfo').textContent = (r && r.nota_url) ? 'Nota sudah ada. Pilih berkas baru hanya bila ingin menggantinya.' : '';
  el('tiraiKas').hidden = false;
}

function simpanFormKas(tombol) {
  tombol.disabled = true;
  panggil('simpanKasUmum', {
    id_kas: el('kfId').value, jenis: el('kfJenis').value, tanggal: el('kfTanggal').value,
    kategori: el('kfKategori').value, jumlah: el('kfJumlah').value, metode: el('kfMetode').value,
    keterangan: el('kfKet').value
  }, APP.ku.nota).then(function () {
    el('tiraiKas').hidden = true;
    pesan('Transaksi tersimpan.');
    muatKasUmum();
  }).catch(function (e) { pesan(e.message, true); })
    .then(function () { tombol.disabled = false; });
}

/* --- edit & hapus dari baris buku kas --- */

function editBarisKu(i) {
  var r = APP.ku.daftar[i]; if (!r) return;
  if (r.sumber === 'Kas') return bukaFormKas(r.jenis, r);
  APP.ku.bayarId = r.id;
  el('ebInfo').innerHTML = '<b>' + aman(r.uraian) + '</b> · ' + aman(labelTagihan(r.periode_tagihan, r.nama_biaya)) +
    '<br>Jumlah tidak boleh membuat tagihan kelebihan bayar.';
  el('ebTanggal').value = r.tanggal;
  el('ebJumlah').value = r.jumlah;
  el('ebMetode').innerHTML = APP.ku.konfig.metode.map(function (m) {
    return '<option' + (r.metode === m ? ' selected' : '') + '>' + aman(m) + '</option>';
  }).join('');
  el('ebCatatan').value = r.catatan || '';
  el('tiraiEditBayar').hidden = false;
}

function hapusBarisKu(i) {
  var r = APP.ku.daftar[i]; if (!r) return;
  APP.ku.hapus = { tipe: r.sumber === 'Kas' ? 'kas' : 'bayar', id: r.id };
  el('hkInfo').innerHTML = 'Hapus permanen <b>' + (r.jenis === 'Masuk' ? 'pemasukan' : 'pengeluaran') + ' ' + rp(r.jumlah) + '</b> (' +
    aman(r.kategori) + ' · ' + aman(r.uraian) + ')?' +
    (r.sumber === 'Iuran' ? '<br>Tagihan atlet tetap ada, sisanya bertambah kembali.' : '') +
    '<br>Salinan datanya tersimpan di riwayat perubahan.';
  el('hkAlasan').value = '';
  el('tiraiHapusKeu').hidden = false;
}

function kirimHapusKeu(tombol) {
  var alasan = el('hkAlasan').value.trim();
  if (!alasan) return pesan('Alasan penghapusan wajib diisi.', true);
  var h = APP.ku.hapus; if (!h) return;
  var fn = h.tipe === 'kas' ? 'hapusKasUmum' : (h.tipe === 'bayar' ? 'hapusPembayaranAdmin' : 'hapusTagihanAdmin');
  tombol.disabled = true;
  panggil(fn, h.id, alasan).then(function () {
    el('tiraiHapusKeu').hidden = true;
    el('tiraiTagihanAdmin').hidden = true;
    pesan('Data dihapus permanen dan tercatat di riwayat.');
    muatSubKeuangan();
  }).catch(function (e) { pesan(e.message, true); })
    .then(function () { tombol.disabled = false; });
}

/* --- edit penuh tagihan (tombol tambahan di tabel Iuran, hanya Admin) --- */

(function () {
  var gambarIuranSebelumnya = gambarIuran;
  gambarIuran = function () {
    gambarIuranSebelumnya.apply(this, arguments);
    if (!adalahAdmin()) return;
    document.querySelectorAll('#iuTabel button[onclick^="bukaUbahTagihan"]').forEach(function (b) {
      var m = /bukaUbahTagihan\('([^']+)'\)/.exec(b.getAttribute('onclick'));
      if (!m) return;
      b.insertAdjacentHTML('afterend',
        '<button class="tombol kedua tombol-kecil" onclick="bukaTagihanAdmin(\'' + m[1] + '\')">Edit penuh</button>');
    });
  };
})();

function bukaTagihanAdmin(id) {
  var t = APP.keu.iuranData.filter(function (x) { return x.id_tagihan === id; })[0];
  if (!t) return;
  APP.ku.tagihanId = id;
  el('taInfo').innerHTML = '<b>' + aman(t.nama_atlet) + '</b> · ' + aman(labelTagihan(t.periode, t.nama_biaya)) +
    '<br>Sudah dibayar ' + rp(t.terbayar) + ' (nominal tidak boleh di bawah ini).';
  el('taNamaWrap').hidden = !t.custom;
  el('taPeriodeWrap').hidden = !t.custom;
  el('taNama').value = t.custom ? t.nama_biaya : '';
  el('taPeriode').value = t.periode;
  el('taNominal').value = t.nominal;
  el('taCatatan').value = t.catatan || '';
  el('btnTaHapus').hidden = !t.custom;
  el('taPeringatan').textContent = t.custom
    ? 'Menghapus tagihan biaya lain juga menghapus pembayarannya.'
    : 'Tagihan iuran bulanan dibuat otomatis, jadi bulannya tidak bisa diubah dan tidak bisa dihapus. Ubah nominal menjadi 0 untuk membebaskan bulan ini.';
  el('tiraiTagihanAdmin').hidden = false;
}

/* ---------- Pendengar (delegasi) ---------- */

document.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('button') : null;
  if (!t || !t.id) return;
  switch (t.id) {
    case 'btnKuMasuk': bukaFormKas('Masuk', null); break;
    case 'btnKuKeluar': bukaFormKas('Keluar', null); break;
    case 'btnKfBatal': el('tiraiKas').hidden = true; break;
    case 'btnKfSimpan': simpanFormKas(t); break;
    case 'btnKuKonfig':
      if (!APP.ku.konfig) return pesan('Data belum termuat. Coba lagi.', true);
      el('kcMasuk').value = APP.ku.konfig.kat_masuk.join('\n');
      el('kcKeluar').value = APP.ku.konfig.kat_keluar.join('\n');
      el('kcSaldo').value = APP.ku.konfig.saldo_awal;
      el('tiraiKonfigKas').hidden = false;
      break;
    case 'btnKcBatal': el('tiraiKonfigKas').hidden = true; break;
    case 'btnKcSimpan':
      t.disabled = true;
      panggil('simpanKonfigKas', {
        kat_masuk: el('kcMasuk').value.split('\n'), kat_keluar: el('kcKeluar').value.split('\n'),
        saldo_awal: el('kcSaldo').value
      }).then(function (k) {
        APP.ku.konfig = k; el('tiraiKonfigKas').hidden = true;
        pesan('Pengaturan kas tersimpan.'); muatKasUmum();
      }).catch(function (err) { pesan(err.message, true); })
        .then(function () { t.disabled = false; });
      break;
    case 'btnEbBatal': el('tiraiEditBayar').hidden = true; break;
    case 'btnEbSimpan':
      t.disabled = true;
      panggil('ubahPembayaranAdmin', {
        id_bayar: APP.ku.bayarId, tanggal: el('ebTanggal').value, jumlah: el('ebJumlah').value,
        metode: el('ebMetode').value, catatan: el('ebCatatan').value
      }).then(function () {
        el('tiraiEditBayar').hidden = true; pesan('Pembayaran diperbarui dan tercatat.'); muatSubKeuangan();
      }).catch(function (err) { pesan(err.message, true); })
        .then(function () { t.disabled = false; });
      break;
    case 'btnTaBatal': el('tiraiTagihanAdmin').hidden = true; break;
    case 'btnTaSimpan':
      t.disabled = true;
      panggil('ubahTagihanAdmin', {
        id_tagihan: APP.ku.tagihanId, nama_biaya: el('taNama').value, periode: el('taPeriode').value,
        nominal: el('taNominal').value, catatan: el('taCatatan').value
      }).then(function () {
        el('tiraiTagihanAdmin').hidden = true; pesan('Tagihan diperbarui dan tercatat.'); muatSubKeuangan();
      }).catch(function (err) { pesan(err.message, true); })
        .then(function () { t.disabled = false; });
      break;
    case 'btnTaHapus':
      var tg = APP.keu.iuranData.filter(function (x) { return x.id_tagihan === APP.ku.tagihanId; })[0];
      if (!tg) return;
      APP.ku.hapus = { tipe: 'tagihan', id: tg.id_tagihan };
      el('hkInfo').innerHTML = 'Hapus permanen tagihan <b>' + aman(labelTagihan(tg.periode, tg.nama_biaya)) + '</b> milik <b>' +
        aman(tg.nama_atlet) + '</b> (' + rp(tg.nominal) + ') beserta semua pembayarannya (' + rp(tg.terbayar) + ')?' +
        '<br>Salinan datanya tersimpan di riwayat perubahan.';
      el('hkAlasan').value = '';
      el('tiraiHapusKeu').hidden = false;
      break;
    case 'btnHkBatal': el('tiraiHapusKeu').hidden = true; break;
    case 'btnHkKirim': kirimHapusKeu(t); break;
  }
});

document.addEventListener('change', function (e) {
  if (!e.target) return;
  if (e.target.id === 'kuBulan' || e.target.id === 'kuSemua') muatKasUmum();
  if (e.target.id === 'kfNota') {
    bacaBerkas(e.target).then(function (f) { APP.ku.nota = f; })
      .catch(function (err) { pesan(err.message, true); e.target.value = ''; });
  }
});
</script>
